<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Vikhyath Vardhan — AI engineering</title>
  <desc id="desc">A blue animated banner with Research, Build, and Review connected in a flowing sequence.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#071225"/><stop offset="1" stop-color="#102b51"/></linearGradient>
    <linearGradient id="beam"><stop stop-color="#2a73cf"/><stop offset="0.5" stop-color="#a1d7ff"/><stop offset="1" stop-color="#2a73cf"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#1b6cc0" stop-opacity=".38"/><stop offset="1" stop-color="#1b6cc0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8dbcf1" stroke-opacity=".06"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="5"/></filter>
    <style>
      .packet {animation:travel 5s linear infinite}
      .packet.second {animation-delay:-2.5s}
      .halo {animation:breathe 4s ease-in-out infinite;transform-origin:center}
      .node {animation:rise 4s ease-in-out infinite}
      .node.build {animation-delay:-1.4s}
      .node.review {animation-delay:-2.8s}
      @keyframes travel {0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(373px);opacity:0}}
      @keyframes breathe {50%{opacity:.48;transform:scale(1.08)}}
      @keyframes rise {50%{transform:translateY(-4px)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#background)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <circle class="halo" cx="951" cy="143" r="192" fill="url(#aura)"/>
  <path d="M36 27H1164M36 273H1164" stroke="#79baff" stroke-opacity=".2"/>
  <text x="55" y="70" fill="#8dc5ff" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="3">AI ENGINEERING / GITHUB PROFILE</text>
  <text x="55" y="137" fill="#eef6ff" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="700">Vikhyath Vardhan</text>
  <text x="57" y="179" fill="#b8cce8" font-family="Arial,Helvetica,sans-serif" font-size="19">Building and evaluating practical AI systems</text>
  <g transform="translate(55 213)" fill="none" stroke="#79baff" stroke-opacity=".7"><circle cx="9" cy="9" r="7"/><path d="M9 5v8M5 9h8"/></g>
  <text x="84" y="229" fill="#9fc9f8" font-family="Arial,Helvetica,sans-serif" font-size="15">Structured extraction  ·  Incident automation  ·  Evaluation</text>
  <path d="M734 157H1120" stroke="#6caaf5" stroke-opacity=".27" stroke-width="2"/>
  <path d="M746 157H1118" stroke="url(#beam)" stroke-opacity=".45" stroke-width="2" stroke-dasharray="5 13"/>
  <g class="packet"><circle cx="746" cy="157" r="6" fill="#a9daff" filter="url(#glow)"/><circle cx="746" cy="157" r="3" fill="#d7efff"/></g>
  <g class="packet second"><circle cx="746" cy="157" r="6" fill="#a9daff" filter="url(#glow)"/><circle cx="746" cy="157" r="3" fill="#d7efff"/></g>
  <g class="node research"><rect x="730" y="116" width="102" height="82" rx="13" fill="#102e55" stroke="#7ab7fa"/><circle cx="781" cy="144" r="9" fill="none" stroke="#a9d5ff" stroke-width="2"/><path d="m788 151 8 8" stroke="#a9d5ff" stroke-width="2"/><text x="781" y="179" text-anchor="middle" fill="#d9ecff" font-family="Arial,Helvetica,sans-serif" font-size="13">RESEARCH</text></g>
  <g class="node build"><rect x="877" y="116" width="102" height="82" rx="13" fill="#102e55" stroke="#7ab7fa"/><path d="m928 134 14 8-14 8-14-8zM914 149l14 8 14-8M914 156l14 8 14-8" fill="none" stroke="#a9d5ff" stroke-width="2"/><text x="928" y="179" text-anchor="middle" fill="#d9ecff" font-family="Arial,Helvetica,sans-serif" font-size="13">BUILD</text></g>
  <g class="node review"><rect x="1024" y="116" width="102" height="82" rx="13" fill="#102e55" stroke="#7ab7fa"/><path d="m1067 148 7 7 13-15" fill="none" stroke="#a9d5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1075" y="179" text-anchor="middle" fill="#d9ecff" font-family="Arial,Helvetica,sans-serif" font-size="13">REVIEW</text></g>
  <text x="1121" y="263" text-anchor="end" fill="#7098c4" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2">vikhyath2</text>
</svg>
